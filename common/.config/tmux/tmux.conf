# ~/.config/tmux/tmux.conf

# ── Terminal ─────────────────────────────────────────────────────────
# macOS's system terminfo has no tmux-256color; less/htop there reject it.
if-shell '/usr/bin/infocmp tmux-256color' \
  'set -g default-terminal tmux-256color' \
  'set -g default-terminal screen-256color'

# RGB, undercurl and sync come from Ghostty's terminfo; these two don't.
set -as terminal-features 'xterm-ghostty:extkeys:hyperlinks'

set -s escape-time 10
set -s focus-events on
set -s extended-keys on
# Apps (nvim over ssh) can copy through tmux to the system clipboard via OSC 52.
set -s set-clipboard on
set -g allow-passthrough on

set -g set-titles on
set -g set-titles-string '#S · #W'

# Non-login: .zprofile would prepend PATH a second time in every pane.
set -g default-command "${SHELL}"

# ── Sessions, windows, panes ─────────────────────────────────────────
# Lines, not bytes. Ghostty's own scrollback never sees output inside tmux.
set -g history-limit 100000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g detach-on-destroy off
set -g display-time 2000
set -g mouse on

# ── Keybindings ──────────────────────────────────────────────────────
bind r source-file ~/.config/tmux/tmux.conf \; display 'tmux.conf reloaded'

bind c   new-window      -c '#{pane_current_path}'
bind '\' split-window -h -c '#{pane_current_path}'
bind -   split-window -v -c '#{pane_current_path}'
bind %   split-window -h -c '#{pane_current_path}'
bind '"' split-window -v -c '#{pane_current_path}'

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# ── Copy mode ────────────────────────────────────────────────────────
setw -g mode-keys vi
bind -T copy-mode-vi v   send -X begin-selection
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi y   send -X copy-selection-and-cancel
# Same as Ghostty's copy-on-select = false: a drag selects, y/Enter copies.
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-selection-no-clear -C

# ── Theme ────────────────────────────────────────────────────────────
# tokyonight-night, matching Ghostty and nvim. bg=default keeps Ghostty's opacity.
set -g status-style 'bg=default,fg=#a9b1d6'
set -g status-left-length 30
set -g status-left '#[fg=#1a1b26,bg=#7aa2f7,bold] #S #[default] '
set -g status-right '#{?client_prefix,#[fg=#ff9e64]PREFIX ,}#[fg=#565f89]#h '
set -g window-status-bell-style 'fg=#1a1b26,bg=#ff9e64,bold'
set -g window-status-separator ''
set -g window-status-format ' #I #W '
set -g window-status-current-format '#[fg=#1a1b26,bg=#bb9af7,bold] #I #W#{?window_zoomed_flag, Z,} '

set -g pane-border-style 'fg=#3b4261'
set -g pane-active-border-style 'fg=#7aa2f7'
set -g pane-border-indicators both
set -g message-style 'bg=#292e42,fg=#c0caf5'
set -g mode-style 'bg=#283457'

# Per-OS overrides; only the active platform's file exists.
source-file -q ~/.config/tmux/linux.conf
source-file -q ~/.config/tmux/macos.conf
