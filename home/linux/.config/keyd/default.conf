[ids]
*
# Espanso virtual device: grabbing it echoes expansions back to espanso as typed input.
-1234:5678

[main]
# Oneshots
shift = oneshot(shift)
meta = oneshot(meta)
control = oneshot(control)

leftalt = oneshot(alt)
rightalt = oneshot(altgr)

# Maps capslock to escape when pressed and control when held.
capslock = overload(control, esc)

# Paste Insert
insert = S-insert
