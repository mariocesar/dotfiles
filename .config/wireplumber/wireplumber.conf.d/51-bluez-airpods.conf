monitor.bluez.properties = {
  bluez5.codecs = [ aac sbc_xq sbc ]

  # Lets BlueZ report a real playback status, so LibrePods ear-detection can pause/resume.
  bluez5.dummy-avrcp-player = true
}

wireplumber.settings = {
  # AirPods have no A2DP mic, so any app opening an input drops the whole device
  # to 8 kHz mono HFP. Switch with the airpods script instead.
  bluetooth.autoswitch-to-headset-profile = false
}
