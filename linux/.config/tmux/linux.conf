# Same as Ghostty's linux copy-on-select: a drag feeds the primary selection.
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-no-clear -C 'wl-copy --primary'

# tmux holds the mouse, so Ghostty never sees middle-click; paste primary here.
bind -n MouseDown2Pane select-pane -t = \; if -F '#{||:#{pane_in_mode},#{mouse_any_flag}}' \
  { send -M } \
  { run -b "wl-paste --primary --no-newline | tmux load-buffer -b primary - && tmux paste-buffer -p -d -b primary -t '#{pane_id}'" }
